<div id="shell"><nav id="nav" aria-label="Menu principal"></nav><div id="scrim"></div><div id="col"><header id="bar"></header><nav id="tabs" aria-label="Seções principais"></nav><main id="app"></main></div></div>

<script>
const C=Core,$=s=>document.querySelector(s),S={},A={};

const KEY='cl:v2',DEF={theme:'auto',fs:18,sp:20,pol:'keep',hideBlank:false,chordColor:'blue'},NOTES=['C','C#','D','Eb','E','F','F#','G','Ab','A','Bb','B'];

 if(!d)try{const o=JSON.parse(localStorage.getItem('cc:v1'));if(o&&o.songs)d={songs:o.songs,lists:(o.lists||[]).map(l=>({id:l.id,name:l.name,items:(l.ids||[]).map(id=>({id,tr:0,note:'',ens:false}))}))}}catch(e){}
 d=d&&Array.isArray(d.songs)?d:{songs:[],lists:[]};d.lists=d.lists||[];d.prefs=Object.assign({},DEF,d.prefs);return d}

const cs=o=>o&&typeof o.title==='string'&&typeof o.body==='string'?{id:cid(o.id),title:o.title,artist:String(o.artist||''),key:String(o.key||''),cat:String(o.cat||''),body:o.body,source:String(o.source||'backup'),license:String(o.license||''),favorite:!!o.favorite,fs:clamp(+o.fs||P().fs,10,48),sp:clamp(+o.sp||P().sp,5,80),ts:+o.ts||0}:null;
const cl=o=>o&&typeof o.name==='string'?{id:cid(o.id),name:o.name,celeb:String(o.celeb||''),date:String(o.date||''),items:(Array.isArray(o.items)?o.items:[]).map(x=>({id:cid(x.id),tr:clamp(+x.tr||0,-11,11),note:String(x.note||''),ens:!!x.ens}))}:null;
function toast(m){const e=$('#toast');e.textContent=m;e.style.display='block';clearTimeout(tt);tt=setTimeout(()=>e.style.display='none',3500)}
function dlg(h){return new Promise(r=>{const d=$('#dlg');d.returnValue='';d.innerHTML=h;d.onclick=e=>{const b=e.target.closest('[data-r]');if(b)d.close(b.dataset.r)};d.onclose=()=>r(d.returnValue);d.showModal()})}
const ask=(m,ok='Confirmar',danger)=>dlg('<p>'+esc(m)+'</p><div class="bar" style="justify-content:flex-end"><button data-r="n">Cancelar</button><button data-r="y" class="'+(danger?'d':'p')+'">'+esc(ok)+'</button></div>').then(x=>x==='y');
const menu=(t_,its)=>dlg('<h3>'+esc(t_)+'</h3>'+its.map((x,i)=>'<div class="row" role="button" tabindex="0" data-r="'+i+'"><div>'+esc(x[0])+'</div></div>').join('')).then(x=>{if(x!==''&&its[+x])its[+x][1]()});

const theme=()=>{const r=document.documentElement;P().theme==='auto'?r.removeAttribute('data-theme'):r.dataset.theme=P().theme};

function lock(){if(!wl&&navigator.wakeLock)navigator.wakeLock.request('screen').then(x=>wl=x).catch(()=>{})}

const closeNav=()=>{$('#nav').classList.remove('o');$('#scrim').classList.remove('o')};
async function go(p,o={}){stopTuner(false);stopMetronome(false);if(v.p==='edit'&&dirty&&!(await ask('Descartar as alterações não salvas?','Descartar',1)))return;dirty=false;stop();v=Object.assign({p},o);t={n:v.q?v.q[v.i].tr||0:0,pol:P().pol};closeNav();render();scrollTo(0,0)}
function applyChordColor(){const colors={blue:'#1769AA',green:'#198754',orange:'#d97706',red:'#dc2626',purple:'#7c3aed'};document.documentElement.style.setProperty('--ch',colors[P().chordColor]||colors.blue)}
function render(){applyChordColor();document.body.className=v.p==='stage'?'stage'+(P().theme==='hc'?' hc':''):'';$('#bar').style.display=v.p==='stage'?'none':'';v.p==='stage'?lock():unlock();(S[v.p]||S.songs)();nav();tabs()}
function re(){const y=scrollY;render();scrollTo(0,y)}
function tabs(){const n=$('#tabs');if(!n)return;const allowed=['songs','artists','lists','favorites','recent'];if(!allowed.includes(v.p)){n.hidden=true;n.innerHTML='';return}n.hidden=false;n.innerHTML=[['songs','Biblioteca'],['artists','Artistas'],['lists','Repertórios'],['favorites','Favoritas'],['recent','Recentes']].map(([k,l])=>'<button data-tab="'+k+'"'+(v.p===k?' aria-current="page"':'')+'>'+l+'</button>').join('')}
function nav(){const cur=({view:'songs',edit:'songs',list:'lists',stagepick:'stage',stage:'stage'})[v.p]||v.p;
 $('#nav').innerHTML='<div class="hd"><svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="15" fill="#fff" opacity=".2"/><path d="M12 22V9l11-2v13" fill="none" stroke="#fff" stroke-width="2.2"/><circle cx="10" cy="22" r="3" fill="#fff"/><circle cx="21" cy="20" r="3" fill="#fff"/></svg>Cifra Livre</div>'+NAV.map(([k,l,i])=>'<button class="it" data-g="'+k+'"'+(k===cur?' aria-current="page"':'')+'><span aria-hidden="true">'+i+'</span>'+l+'</button>').join('')}
function bar(title,o={}){$('#bar').innerHTML=(o.back?'<button class="ib" data-a="back" aria-label="Voltar">‹</button>':'<button class="ib mb" data-m="1" aria-label="Abrir menu">☰</button>')+'<h1>'+esc(title)+'</h1>'+(o.acts||[]).map(([a,l,i])=>'<button class="ib" data-a="'+a+'" aria-label="'+l+'" title="'+l+'">'+i+'</button>').join('')}
const app=h=>{$('#app').innerHTML=h};
const empty=(h,m,bs)=>'<div style="text-align:center;padding:36px 8px"><h2>'+h+'</h2><p class="m">'+m+'</p><div class="bar" style="justify-content:center">'+bs.map(([a,l,c])=>'<button data-a="'+a+'" class="'+c+'">'+l+'</button>').join('')+'</div></div>';
const srow=s=>'<div class="row" role="button" tabindex="0" data-a="open" data-id="'+s.id+'"><span aria-hidden="true">♫</span><div><b>'+esc(s.title)+'</b><small>'+esc(s.artist||'Sem artista')+(s.cat?' · '+esc(s.cat):'')+'</small></div><button class="ib" data-a="rowm" data-id="'+s.id+'" aria-label="Opções de '+esc(s.title)+'">⋮</button></div>';

const sortSel=()=>'<div class="bar"><label>Ordenar por <select id="so"><option value="artist"'+(sort==='artist'?' selected':'')+'>Artista</option><option value="title"'+(sort==='title'?' selected':'')+'>Título</option><option value="recent"'+(sort==='recent'?' selected':'')+'>Recentes</option></select></label></div>';
S.songs=()=>{const home=v.cat===undefined;bar(home?'Minhas músicas':v.cat==='*'?'Todos':v.cat,home?{acts:[['new','Adicionar música','+'],['gosearch','Pesquisar','⌕'],['gohelp','Ajuda','?'],['more','Mais opções','⋮']]}:{back:1});

 if(!home){const L=db.songs.filter(s=>v.cat==='*'||(s.artist.trim()||'Artista desconhecido')===v.cat).sort(SORT[sort]);return app(sortSel()+(L.map(srow).join('')||'<p class="m">Nenhuma música nesta pasta.</p>'))}
 const cats=[...new Set(db.songs.map(s=>s.artist.trim()||'Artista desconhecido'))].sort((a,b)=>a.localeCompare(b,'pt')),rc=db.songs.filter(s=>s.ts).sort(SORT.recent).slice(0,3);
 const fr=(c,n,l)=>'<div class="row" role="button" tabindex="0" data-a="cat" data-v="'+esc(c)+'"><span aria-hidden="true">▤</span><div><b>'+esc(l)+'</b><small>'+n+' música(s)</small></div></div>';
 app(fr('*',db.songs.length,'Todas as músicas')+cats.map(c=>fr(c,db.songs.filter(s=>(s.artist.trim()||'Artista desconhecido')===c).length,c)).join('')+(rc.length?'<h3>Recentes</h3>'+rc.map(srow).join(''):'')+(db.lists.length?'<h3>Repertórios</h3>'+db.lists.slice(0,3).map(lrow).join(''):''))};

function resS(){const k=C.normalize(q),L=k?db.songs.filter(s=>C.normalize(s.title+' '+s.artist).includes(k)).sort(SORT.artist):[];
 $('#res').innerHTML=!k?'<h3>Pesquisar</h3><p class="m">Digite o título ou o nome do artista para procurar na biblioteca e na internet.</p>':(L.length?'<h3>Na sua biblioteca ('+L.length+')</h3>'+L.map(srow).join(''):'<p class="m">Nenhuma música encontrada na biblioteca local.</p>')+'<div class="bar"><button class="p" data-a="websearch">⌕ Pesquisar “'+esc(q)+'” na internet</button><button data-a="newq">Cadastrar música</button></div>'}
S.artists=()=>{bar('Artistas');const L=[...new Set(db.songs.map(s=>s.artist.trim()||'Artista desconhecido'))].sort((a,b)=>a.localeCompare(b,'pt'));app(L.length?L.map(a=>'<div class="row" role="button" tabindex="0" data-a="cat" data-v="'+esc(a)+'"><span aria-hidden="true">♬</span><div><b>'+esc(a)+'</b><small>'+db.songs.filter(s=>(s.artist.trim()||'Artista desconhecido')===a).length+' música(s)</small></div></div>').join(''):empty('Nenhum artista','Adicione músicas à biblioteca para organizar os artistas.',[['new','Adicionar música','p']]))};

S.list=()=>{const l=list_(v.id);if(!l)return go('lists');l.items=l.items.filter(i=>song(i.id));

 app('<p class="m">'+[l.celeb,l.date].filter(Boolean).map(esc).join(' · ')+'</p>'+(l.items.map((it,i)=>{const s=song(it.id);return '<div style="border-bottom:1px solid var(--dv);padding:8px 0"><div class="row" style="border:0" role="button" tabindex="0" data-a="openitem" data-i="'+i+'"><span>'+(i+1)+'</span><div><b>'+esc(s.title)+'</b><small>'+esc(s.artist)+'</small></div></div><div class="bar"><span class="m">Tom do evento</span><button data-a="ittr" data-i="'+i+'" data-d="-1" aria-label="Descer semitom">−</button><b>'+(it.tr>0?'+':'')+it.tr+'</b><button data-a="ittr" data-i="'+i+'" data-d="1" aria-label="Subir semitom">+</button><label style="margin:0"><input type="checkbox" data-a="itens" data-i="'+i+'"'+(it.ens?' checked':'')+'>Ensaiada</label><button data-a="itup" data-i="'+i+'" aria-label="Mover para cima">↑</button><button data-a="itdn" data-i="'+i+'" aria-label="Mover para baixo">↓</button><button data-a="itrm" data-i="'+i+'" aria-label="Remover da lista">✕</button></div><input data-n="'+i+'" placeholder="Observações" value="'+esc(it.note)+'" aria-label="Observações"></div>'}).join('')||empty('Lista vazia','Abra uma música e use “Adicionar à lista”.',[])))};
S.view=()=>{const it=v.q[v.i],s=song(it.id);if(!s)return go('songs');const pol=t.pol,cur=s.key&&C.isChordToken(s.key)?C.transposeLine(s.key,t.n,pol,'sharp'):'';

function metroClick(){if(!metroCtx)return;const osc=metroCtx.createOscillator(),gain=metroCtx.createGain();osc.frequency.value=metroBeat===0?1100:800;gain.gain.setValueAtTime(0.0001,metroCtx.currentTime);gain.gain.exponentialRampToValueAtTime(0.16,metroCtx.currentTime+0.008);gain.gain.exponentialRampToValueAtTime(0.0001,metroCtx.currentTime+0.07);osc.connect(gain);gain.connect(metroCtx.destination);osc.start();osc.stop(metroCtx.currentTime+0.08);metroBeat=(metroBeat+1)%4}function stopMetronome(refresh=true){if(metroTimer){clearInterval(metroTimer);metroTimer=null}if(metroCtx){metroCtx.close().catch(()=>{});metroCtx=null}if(refresh&&v.p==='res')re()}function startMetronome(){const AC=window.AudioContext||window.webkitAudioContext;if(!AC){toast('Este aparelho não oferece suporte ao áudio necessário.');return}try{metroCtx=new AC();metroCtx.resume();metroBeat=0;metroClick();metroTimer=setInterval(metroClick,60000/metroBpm);toast('Metrônomo iniciado: '+metroBpm+' BPM.')}catch(e){stopMetronome(false);toast('Não foi possível iniciar o áudio neste aparelho.')}re()}
function stopTuner(update=true){if(tunerFrame!==null){cancelAnimationFrame(tunerFrame);tunerFrame=null}if(tunerStream){tunerStream.getTracks().forEach(t=>t.stop());tunerStream=null}if(tunerCtx){tunerCtx.close().catch(()=>{});tunerCtx=null}if(update&&$('#tunestatus'))$('#tunestatus').textContent='Afinador parado.'}
function detectPitch(buf,sr){let rms=0;for(let i=0;i<buf.length;i++)rms+=buf[i]*buf[i];rms=Math.sqrt(rms/buf.length);if(rms<0.012)return null;let best=-1,bestCorr=0;for(let lag=Math.floor(sr/1000);lag<Math.floor(sr/65);lag++){let corr=0;for(let i=0;i<buf.length-lag;i+=2)corr+=buf[i]*buf[i+lag];corr/=buf.length-lag;if(corr>bestCorr){bestCorr=corr;best=lag}}if(best<0||bestCorr<0.2)return null;return sr/best}
async function startTuner(){if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){toast('O navegador não permite acesso ao microfone neste contexto.');return}stopTuner(false);try{tunerStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});const AC=window.AudioContext||window.webkitAudioContext;if(!AC)throw Error('AudioContext indisponível');tunerCtx=new AC();await tunerCtx.resume();const src=tunerCtx.createMediaStreamSource(tunerStream),an=tunerCtx.createAnalyser();an.fftSize=4096;src.connect(an);const buf=new Float32Array(an.fftSize),names=['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];const loop=()=>{if(!tunerCtx||!$('#tunenote'))return;an.getFloatTimeDomainData(buf);const hz=detectPitch(buf,tunerCtx.sampleRate);if(hz){const midi=Math.round(69+12*Math.log2(hz/440)),ideal=440*Math.pow(2,(midi-69)/12),cents=Math.round(1200*Math.log2(hz/ideal));$('#tunenote').textContent=names[((midi%12)+12)%12]+(Math.floor(midi/12)-1);$('#tunefreq').textContent=hz.toFixed(1)+' Hz';$('#tunecents').textContent=(cents>0?'+':'')+cents+' cent';$('#tunestatus').textContent=Math.abs(cents)<=5?'Afinado':cents<0?'Nota baixa — aumente a tensão com cuidado':'Nota alta — diminua a tensão com cuidado'}else{$('#tunefreq').textContent='— Hz';$('#tunecents').textContent='Toque uma corda isolada';}tunerFrame=requestAnimationFrame(loop)};$('#tunestatus').textContent='Microfone ativo.';loop()}catch(e){stopTuner(false);const el=$('#tunestatus');if(el)el.textContent='Não foi possível iniciar. Verifique a permissão do microfone e tente novamente.';toast('Acesso ao microfone não autorizado ou indisponível.')}}

A.togglefav=d=>{const s=song(d.id);if(!s)return;s.favorite=!s.favorite;save();toast(s.favorite?'Adicionada às favoritas.':'Removida das favoritas.');re()};
 A.rowm=d=>{const s=song(d.id);menu(s.title,[['Abrir',()=>A.open(d)],['Editar',()=>go('edit',{id:d.id,ret:v})],[s.favorite?'Remover das favoritas':'Adicionar às favoritas',()=>A.togglefav({id:d.id})],['Adicionar à lista',()=>addTo(d.id)],['Excluir',()=>delSong(d.id)]])};
async function delSong(id){if(await ask('Excluir “'+song(id).title+'”? Esta ação não pode ser desfeita.','Excluir',1)){db.songs=db.songs.filter(x=>x.id!==id);db.lists.forEach(l=>l.items=l.items.filter(i=>i.id!==id));save();toast('Música excluída.');v.p==='view'||v.p==='edit'?go('songs'):re()}}
function addTo(id){if(!db.lists.length)return toast('Crie um repertório primeiro na seção Repertórios.');menu('Adicionar à lista',db.lists.map(l=>[l.name,()=>{if(l.items.some(i=>i.id===id))return toast('A música já está nessa lista.');l.items.push({id,tr:0,note:'',ens:false});save();toast('Adicionada a “'+l.name+'”.')}]))}
A.vmenu=()=>{const s=song(v.q[v.i].id);menu(s.title,[['Informações da música',()=>dlg('<h3>'+esc(s.title)+'</h3><p>Artista: '+esc(s.artist||'—')+'<br>Tom original: '+esc(s.key||'não informado')+'<br>Pasta: '+esc(s.cat||'—')+'<br>Origem: '+esc(s.source||'—')+'<br>Licença: '+esc(s.license||'não informada')+'</p><div class="bar" style="justify-content:flex-end"><button data-r="x" class="p">Fechar</button></div>')],[s.favorite?'Remover das favoritas':'Adicionar às favoritas',()=>A.togglefav({id:s.id})],['Adicionar à lista',()=>addTo(s.id)],['Excluir',()=>delSong(s.id)]])};
A.togstage=()=>go('stage',{q:v.q,i:v.i,ret:v});
A.ton=d=>{t.n=d.d==='0'?0:clamp(t.n+ +d.d,-11,11);re()};
A.fs=d=>{const s=song(v.q[v.i].id);s.fs=clamp(s.fs+ +d.d*2,10,48);save();re()};
A.play=()=>{if(timer)stop();else{acc=0;timer=setInterval(()=>{const s=song(v.q[v.i].id);if(!s)return stop();acc+=s.sp/20;const k=Math.floor(acc);if(k>0){scrollBy(0,k);acc-=k}if(innerHeight+scrollY>=document.body.scrollHeight-2){stop();re()}},50)}re()};
A.full=()=>{const d=document;if(d.fullscreenElement)d.exitFullscreen();else if(d.documentElement.requestFullscreen)d.documentElement.requestFullscreen().catch(()=>toast('Tela cheia indisponível aqui.'));else toast('Tela cheia indisponível neste aparelho.')};
const step=k=>{stop();v.i+=k;t.n=v.q[v.i].tr||0;re();scrollTo(0,0)};A.nx=()=>{if(v.i<v.q.length-1)step(1)};A.pv=()=>{if(v.i>0)step(-1)};
A.edit=()=>go('edit',{id:v.q[v.i].id,ret:v});
A.sec=d=>{const e=$('#eb'),p=e.selectionStart;e.setRangeText('['+d.v+']\n',p,e.selectionEnd,'end');e.focus();mark()};
A.paste=()=>navigator.clipboard&&navigator.clipboard.readText?navigator.clipboard.readText().then(x=>{$('#eb').value+=x;mark()}).catch(()=>toast('Não foi possível ler a área de transferência. Cole direto no campo.')):toast('Colar automático indisponível. Cole direto no campo.');
function mark(){dirty=true;const e=$('#dm');if(e)e.textContent='● Alterações não salvas'}
A.save=()=>{const ti=$('#et').value.trim(),k=$('#ek').value.trim();if(!ti)return toast('Informe o título.');if(k&&!C.isChordToken(k))return toast('Tom inválido. Exemplos: G, Em, Bb.');
 let s=v.id&&song(v.id),nw=!s;if(nw){s={id:uid(),source:'manual',license:'',fs:P().fs,sp:P().sp,ts:Date.now()};db.songs.push(s)}
 Object.assign(s,{title:ti,artist:$('#ea').value.trim(),key:k,cat:$('#ec').value.trim(),body:$('#eb').value.replace(/\r\n?/g,'\n')});save();dirty=false;toast('Música salva.');
 go('view',{q:nw?[{id:s.id,tr:0}]:v.ret&&v.ret.q||[{id:s.id,tr:0}],i:nw?0:v.ret&&v.ret.i||0,ret:v.ret&&v.ret.p==='view'?v.ret.ret:v.ret})};
A.newlist=async()=>{const r=await form('Nova lista',[['name','Nome'],['celeb','Celebração (opcional)'],['date','Data (opcional)']]);if(r&&r.name){db.lists.push({id:uid(),name:r.name,celeb:r.celeb,date:r.date,items:[]});save();re()}else if(r)toast('Informe o nome da lista.')};
A.openlist=d=>go('list',{id:d.id,ret:v.p==='list'?v.ret:v});
A.listm=d=>{const l=list_(d.id);menu(l.name,[['Editar nome e dados',async()=>{const r=await form('Editar lista',[['name','Nome'],['celeb','Celebração'],['date','Data']],l);if(r&&r.name){Object.assign(l,r);save();re()}}],['Duplicar',()=>{db.lists.push(Object.assign(JSON.parse(JSON.stringify(l)),{id:uid(),name:l.name+' (cópia)'}));save();re()}],['Excluir',async()=>{if(await ask('Excluir a lista “'+l.name+'”? As músicas são mantidas.','Excluir',1)){db.lists=db.lists.filter(x=>x!==l);save();re()}}]])};
A.startlist=()=>{const l=list_(v.id),q_=l.items.filter(i=>song(i.id)).map(i=>({id:i.id,tr:i.tr}));q_.length?go('stage',{q:q_,i:0,ret:v}):toast('A lista está vazia.')};
A.stlist=d=>{const l=list_(d.id);go('stage',{q:l.items.filter(i=>song(i.id)).map(i=>({id:i.id,tr:i.tr})),i:0,ret:v})};
A.stall=()=>go('stage',{q:[...db.songs].sort(SORT.artist).map(s=>({id:s.id,tr:0})),i:0,ret:v});
const itm=d=>list_(v.id).items[+d.i];
A.ittr=d=>{const it=itm(d);it.tr=clamp(it.tr+ +d.d,-11,11);save();re()};
A.itens=d=>{const it=itm(d);it.ens=!it.ens;save()};
A.itup=d=>{const a=list_(v.id).items,i=+d.i;if(i>0){[a[i-1],a[i]]=[a[i],a[i-1]];save();re()}};
A.itdn=d=>{const a=list_(v.id).items,i=+d.i;if(i<a.length-1){[a[i+1],a[i]]=[a[i],a[i+1]];save();re()}};
A.itrm=d=>{list_(v.id).items.splice(+d.i,1);save();re()};
A.doimp=()=>{const L=tmp.filter(x=>x.ok&&x.sel);if(!L.length)return toast('Nenhuma música selecionada.');L.forEach(x=>db.songs.push({id:uid(),title:x.title||'Sem título',artist:x.artist,key:'',cat:'',body:x.body,source:'import arquivo',license:'',fs:P().fs,sp:P().sp,ts:0}));save();tmp=null;toast(L.length+' música(s) importada(s).');go('songs')};
A.mkbak=()=>{const o={app:'cifra-livre',v:2,date:new Date().toISOString()};if($('#bs').checked)o.songs=db.songs;if($('#bl').checked)o.lists=db.lists;if($('#bp').checked)o.prefs=db.prefs;
 const a=document.createElement('a'),n='cifra-livre-backup-'+o.date.slice(0,10)+'.json';a.href=URL.createObjectURL(new Blob([JSON.stringify(o)],{type:'application/json'}));a.download=n;a.click();toast('Backup gerado: '+n+' (veja a pasta de downloads).')};
A.dorestore=async()=>{const o=tmp,mode=document.querySelector('input[name=rm]:checked').value;const ns=(o.songs||[]).map(cs).filter(Boolean),nl=(o.lists||[]).map(cl).filter(Boolean);
 if(mode==='r'){if(!await ask('Substituir TODOS os dados atuais pelos do backup? Esta ação não pode ser desfeita.','Substituir',1))return;db.songs=ns;db.lists=nl;if(o.prefs&&$('#rp')&&$('#rp').checked)db.prefs=Object.assign({},DEF,o.prefs)}
 else{ns.forEach(x=>{if(!song(x.id))db.songs.push(x)});nl.forEach(x=>{if(!list_(x.id))db.lists.push(x)});if(o.prefs&&$('#rp')&&$('#rp').checked)db.prefs=Object.assign({},DEF,o.prefs)}
 save();theme();tmp=null;toast('Restauração concluída.');go('songs')};
document.addEventListener('click',e=>{const m=e.target.closest('[data-m]');if(m){$('#nav').classList.add('o');$('#scrim').classList.add('o');return}
 if(e.target.id==='scrim')return closeNav();const tab=e.target.closest('[data-tab]');if(tab)return go(tab.dataset.tab);const g=e.target.closest('[data-g]');if(g)return go(g.dataset.g==='stage'?'stagepick':g.dataset.g);
 const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a]&&!(b.tagName==='INPUT'&&b.type==='checkbox'&&false)){if(b.tagName==='INPUT')return;A[b.dataset.a](b.dataset)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeNav();if(v.p==='stage'&&!$('#dlg').open)A.back()}
 if((e.key==='Enter'||e.key===' ')&&e.target.matches('.row[role=button]')){e.preventDefault();e.target.click();return}
 if(v.p==='stage'&&!/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)){if(e.key==='ArrowRight')A.nx();else if(e.key==='ArrowLeft')A.pv();else if(e.key===' '){e.preventDefault();A.play()}}});
document.addEventListener('input',e=>{const x=e.target,i=x.id;
 if(i==='q'){q=x.value;resS()}else if(i==='cq'){drawChords(x.value)}else if(i==='bpm'){metroBpm=+x.value;$('#bpmv').textContent=metroBpm+' BPM';if(metroTimer){clearInterval(metroTimer);metroTimer=setInterval(metroClick,60000/metroBpm)}}else if(i==='sp'){const s=song(v.q[v.i].id);s.sp=+x.value;save()}
 else if(x.hasAttribute('data-e'))mark();else if(x.dataset.n!==undefined){list_(v.id).items[+x.dataset.n].note=x.value;save()}
 else if(x.dataset.it!==undefined)tmp[+x.dataset.it].title=x.value;else if(x.dataset.ia!==undefined)tmp[+x.dataset.ia].artist=x.value;
 else if(i==='pf'){P().fs=+x.value;$('#pfv').textContent=x.value;save()}else if(i==='ps'){P().sp=+x.value;$('#psv').textContent=x.value;save()}});
document.addEventListener('change',async e=>{const x=e.target,i=x.id;
 if(i==='so'){sort=x.value;re()}else if(i==='pol'){t.pol=x.value;re()}
 else if(i==='ks'){const s=song(v.q[v.i].id);t.n=C.keyOffset(s.key,x.value);re()}
 else if(x.dataset.ic!==undefined)tmp[+x.dataset.ic].sel=x.checked;
 else if(i==='pt'){P().theme=x.value;save();theme();render()}else if(i==='pp'){P().pol=x.value;save()}else if(i==='pc'){P().chordColor=x.value;save();applyChordColor();re()}else if(i==='phb'){P().hideBlank=x.checked;save();re()}else if(i==='hideBlank'){P().hideBlank=x.checked;save();re()}
 else if(x.dataset.a==='itens')A.itens(x.dataset);
 else if(i==='fi'){tmp=[];for(const f of x.files)tmp.push(Object.assign({sel:true},C.parseTxt(f.name,await f.text())));pvImp()}
 else if(i==='fz'&&x.files[0]){try{if(!window.JSZip)throw new Error('O leitor ZIP não foi carregado.');const zip=await JSZip.loadAsync(x.files[0]);tmp=[];for(const entry of Object.values(zip.files)){if(entry.dir||!(/\.(txt|cho|pro|crd)$/i).test(entry.name))continue;const parts=entry.name.split('/').filter(Boolean),file=parts.pop(),folder=parts.length?parts[parts.length-1]:'';const item=C.parseTxt(file,await entry.async('string'));if(!item.artist&&folder)item.artist=folder;tmp.push(Object.assign({sel:true},item));}if(!tmp.length){toast('O ZIP não contém arquivos .txt, .cho, .pro ou .crd.');return}pvImp()}catch(err){toast('Não foi possível abrir o ZIP. Verifique se o arquivo não está corrompido.');console.error(err)}}
 else if(i==='rf'&&x.files[0]){try{const o=JSON.parse(await x.files[0].text());if(o.app!=='cifra-livre'||!(o.songs||o.lists||o.prefs))throw 0;tmp=o;
  const ns=(o.songs||[]).map(cs).filter(Boolean),nl=(o.lists||[]).map(cl).filter(Boolean);
  $('#rs').innerHTML='<h3>Resumo do backup</h3><p>'+ns.length+' música(s) ('+ns.filter(y=>song(y.id)).length+' já existem aqui) · '+nl.length+' lista(s) ('+nl.filter(y=>list_(y.id)).length+' já existem) · preferências: '+(o.prefs?'sim':'não')+'</p>'+(o.prefs?'<label><input type="checkbox" id="rp">Restaurar também as preferências</label>':'')+'<label><input type="radio" name="rm" value="m" checked>Mesclar: manter o que existe e adicionar o que falta</label><label><input type="radio" name="rm" value="r">Substituir tudo: apaga os dados atuais</label><button class="p" data-a="dorestore">Restaurar</button>'}catch(err){tmp=null;$('#rs').innerHTML='<p class="dot">Arquivo inválido: não é um backup do Cifra Livre. Nada foi alterado.</p>'}}});
theme();render();
</script></body></html>
